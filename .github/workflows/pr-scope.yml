name: Community app submission check

# First-pass gate for PRs, cheapest checks first — see CONTRIBUTING.md
# "The rules". `pull_request` (not `pull_request_target`), read-only
# permissions: safe to run on forked-repo PRs with the default GITHUB_TOKEN,
# no secrets ever exposed to submitted code. No job checks out the fork's
# tree wholesale — everything is fetched file-by-file via the GitHub API.
#
# scope-check and manual-check only inspect submitted files as text.
# build-check deliberately runs submitted code: it packages each touched
# app with the same FPApp builder the downloads site uses after merge,
# which compiles a small host program from the app and runs it to read the
# app's CONFIG. That moves anything the downloads build would reject to
# before the merge instead of after it. It stays contained by the points
# above — read-only token, no secrets — and only runs once scope-check has
# passed. Keep the repo's Actions setting that requires approval before
# workflows run on fork PRs (Settings > Actions > General), so a maintainer
# sees a new contributor's code before any of it runs.

# Runs on EVERY pull request, with no `paths:` filter. pr-scope-check.sh
# recognises five kinds of PR (submission, app fix, manual edit, version bump,
# maintainer change -- see CONTRIBUTING.md), so no legitimate PR fails by
# construction any more and there is nothing to filter out. Running always
# also means the required `gate` status below reports on every PR; a
# path-filtered required check would never report on a docs PR and would
# leave it stuck at "Expected".
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  scope-check:
    # No bot skip: a skipped scope-check would let a bot PR through the gate.
    # A bot PR (e.g. a Dependabot actions bump) is a maintainer change like
    # any other and needs a code-owner review.
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    outputs:
      passed: ${{ steps.check.outputs.passed }}
      modules: ${{ steps.assemble.outputs.modules }}
    steps:
      - name: Checkout (this repo's own scripts, not the fork's changes)
        uses: actions/checkout@v4

      - name: Fetch PR file list
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --slurp | jq 'add' > files.json

      - name: Fetch base and head catalog and manual-tab content
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          gh api "repos/${{ github.repository }}/contents/apps-catalog.json?ref=$base_sha" \
            --jq '.content' | base64 -d > base-catalog.json
          gh api "repos/${{ github.repository }}/contents/apps-catalog.json?ref=$head_sha" \
            --jq '.content' | base64 -d > head-catalog.json
          gh api "repos/${{ github.repository }}/contents/manual-tab.json?ref=$base_sha" \
            --jq '.content' | base64 -d > base-manual-tab.json
          gh api "repos/${{ github.repository }}/contents/manual-tab.json?ref=$head_sha" \
            --jq '.content' | base64 -d > head-manual-tab.json

      # The diff alone isn't enough for the whole-file checks (busy-loop,
      # param handler): an app fix's patch holds only the changed lines.
      # Fetched as text -- this job never executes it.
      - name: Fetch the full head source of every touched app
        run: |
          head_sha="${{ github.event.pull_request.head.sha }}"
          echo '{}' > head-sources.json
          jq -r '.[] | select((.filename | test("^apps/[a-z][a-z0-9_]*\\.rs$")) and (.status == "added" or .status == "modified")) | .filename' files.json \
            | while IFS= read -r f; do
                gh api "repos/${{ github.repository }}/contents/$f?ref=$head_sha" \
                  --jq '.content' | base64 -d > app-source.rs
                jq --arg f "$f" --rawfile src app-source.rs '. + {($f): $src}' head-sources.json > head-sources.tmp
                mv head-sources.tmp head-sources.json
              done

      # Who counts as a maintainer comes from the BASE commit, never the PR
      # head, so a PR can't add itself to the list. Missing file (the PR that
      # introduces it) or any API error = empty list = nobody is a maintainer.
      - name: Fetch the maintainer list from the base commit
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          if ! gh api "repos/${{ github.repository }}/contents/.github/MAINTAINERS?ref=$base_sha" \
              --jq '.content' | base64 -d > MAINTAINERS; then
            : > MAINTAINERS
          fi
          jq -R -s 'split("\n") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0 and (startswith("#") | not)))' \
            MAINTAINERS > maintainers.json

      # Advisory only (soft-flag): other open PRs that change the same files.
      # Any failure here must not fail the check, so it falls back to {}.
      - name: Find other open PRs touching the same files
        run: |
          if gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,files > open-prs.json; then
            jq -n --argjson me "$PR_NUMBER" --slurpfile open open-prs.json --slurpfile files files.json '
              ($files[0] | map(.filename)) as $mine
              | [ $open[0][] | select(.number != $me) | .number as $n | .files[].path | select(. as $p | $mine | index($p)) | {file: ., pr: $n} ]
              | group_by(.file) | map({key: .[0].file, value: (map(.pr) | unique)}) | from_entries
            ' > overlaps.json || echo '{}' > overlaps.json
          else
            echo '{}' > overlaps.json
          fi

      - name: Assemble fixture and derive module names
        id: assemble
        run: |
          jq -n \
            --arg pr_author "$PR_AUTHOR" \
            --slurpfile maintainers maintainers.json \
            --slurpfile overlaps overlaps.json \
            --slurpfile files files.json \
            --slurpfile base base-catalog.json \
            --slurpfile head head-catalog.json \
            --slurpfile base_manual base-manual-tab.json \
            --slurpfile head_manual head-manual-tab.json \
            --slurpfile head_sources head-sources.json \
            '{
              pr_author: $pr_author,
              maintainers: $maintainers[0],
              overlaps: $overlaps[0],
              files: $files[0],
              base_catalog: $base[0],
              head_catalog: $head[0],
              base_manual_tab: $base_manual[0],
              head_manual_tab: $head_manual[0],
              head_sources: $head_sources[0]
            }' > fixture.json

          # Every added or modified app: one for a submission, one or more
          # for an app fix. The filename regex keeps these shell-safe.
          modules=$(jq -c '[.files[] | select((.filename | test("^apps/[a-z][a-z0-9_]*\\.rs$")) and (.status == "added" or .status == "modified")) | .filename | ltrimstr("apps/") | rtrimstr(".rs")]' fixture.json)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

      - name: Run scope check
        id: check
        run: |
          if .github/scripts/pr-scope-check.sh fixture.json; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  build-check:
    needs: scope-check
    # A version bump touches no apps/*.rs, so there's nothing to build — and
    # GitHub fails a job whose matrix is empty instead of skipping it.
    if: needs.scope-check.outputs.passed == 'true' && needs.scope-check.outputs.modules != '[]'
    runs-on: ubuntu-latest
    # One build per touched app, so an app fix spanning several apps checks
    # each of them rather than only the first.
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.scope-check.outputs.modules) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout (this repo's own scripts, not the fork's changes)
        uses: actions/checkout@v4

      - name: Fetch the app's file, catalog and manual from the PR head
        run: |
          module="${{ matrix.module }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          gh api "repos/${{ github.repository }}/contents/apps/$module.rs?ref=$head_sha" \
            --jq '.content' | base64 -d > "$module.rs"
          gh api "repos/${{ github.repository }}/contents/apps-catalog.json?ref=$head_sha" \
            --jq '.content' | base64 -d > head-catalog.json
          gh api "repos/${{ github.repository }}/contents/manual-tab.json?ref=$head_sha" \
            --jq '.content' | base64 -d > head-manual-tab.json

      # Same toolchain as manual-pages.yml's .fpapp build: nightly first,
      # stable second so stable ends up the default (fpapp's own build needs
      # that; only its native-crate step selects +nightly itself).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv8m.main-none-eabihf
          components: rust-src

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf

      # fpapp shells out to arm-none-eabi-readelf to extract ABI info from
      # each built native image — not on the runner by default.
      - name: Install ARM binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-none-eabi

      - name: Build the app as an installable FPApp (clone faderpunk, make fpapps)
        run: |
          module="${{ matrix.module }}"
          .github/scripts/pr-build-check.sh "$module.rs" "$module" head-catalog.json head-manual-tab.json

  manual-check:
    needs: scope-check
    if: needs.scope-check.outputs.passed == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # This used to build faderpunk-forge and run its manual-splicing logic
      # against a real faderpunk checkout, which caught a schema-valid entry
      # that still didn't render. That path broke when #666 restructured
      # ManualTab.tsx (forge string-matches literal markers in that file) and
      # is being retired rather than repaired: forge's manual tooling was
      # built for a "rebuild the whole manual with a custom firmware" plan
      # that FPApps superseded. The eventual replacement for the "does it
      # actually render" check is FPApps' own lightweight community-manual
      # build, once that exists. Until then, this validates the one file
      # against the schema this repo already ships but never ran in CI —
      # self-contained, no cross-repo checkout, no fragile string-matching.
      - name: Checkout (this repo's schemas, not the fork's changes)
        uses: actions/checkout@v4

      # Only the one file, at the PR's head commit — same
      # never-checkout-fork-code posture as scope-check above, not a new
      # exception for this job.
      - name: Fetch the submitted manual-tab.json at PR head
        run: |
          head_sha="${{ github.event.pull_request.head.sha }}"
          gh api "repos/${{ github.repository }}/contents/manual-tab.json?ref=$head_sha" \
            --jq '.content' | base64 -d > head-manual-tab.json

      - name: Validate against manual-tab.schema.json
        run: npx -y ajv-cli@5 validate -s manual-tab.schema.json -d head-manual-tab.json --spec=draft2020 --strict=false

      # apps-catalog.json had a schema (apps-catalog.schema.json) but no CI
      # step ever ran it, the same gap manual-tab.json had before the step
      # above closed it — added alongside the catalog's new required
      # `version` field (see CONTRIBUTING.md and pr-scope-check.sh's
      # "version bump" scope) so that field is actually enforced, not just
      # documented in the schema.
      - name: Fetch the submitted apps-catalog.json at PR head
        run: |
          head_sha="${{ github.event.pull_request.head.sha }}"
          gh api "repos/${{ github.repository }}/contents/apps-catalog.json?ref=$head_sha" \
            --jq '.content' | base64 -d > head-apps-catalog.json

      - name: Validate against apps-catalog.schema.json
        run: npx -y ajv-cli@5 validate -s apps-catalog.schema.json -d head-apps-catalog.json --spec=draft2020 --strict=false

  # The ONE status to require in branch protection. build-check is a matrix
  # whose job names vary per app (and it is skipped outright when no app is
  # touched), so it can't be required directly. This passes only if
  # scope-check succeeded and nothing else failed or was cancelled; build-check
  # and manual-check may be skipped (docs/infra PRs, or a scope-check failure
  # -- which already fails the gate above).
  gate:
    if: always()
    needs: [scope-check, build-check, manual-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require scope-check success and no failed or cancelled job
        env:
          SCOPE: ${{ needs.scope-check.result }}
          BUILD: ${{ needs.build-check.result }}
          MANUAL: ${{ needs.manual-check.result }}
        run: |
          echo "scope-check=$SCOPE build-check=$BUILD manual-check=$MANUAL"
          [ "$SCOPE" = "success" ] || { echo "scope-check must succeed"; exit 1; }
          for r in "$BUILD" "$MANUAL"; do
            case "$r" in
              success|skipped) ;;
              *) echo "a required job ended as '$r'"; exit 1 ;;
            esac
          done

  # AI first-pass review: not wired up yet. Per the plan (see CONTRIBUTING.md
  # "Review"), this is meant to run once scope-check and build-check both
  # pass, and flag things the mechanical checks can't (API misuse that's
  # technically within bounds, a manual entry that doesn't match the code)
  # as an advisory comment — never a merge gate on its own. Needs a decision
  # on provider/model and API key management before it can be added for
  # real; deliberately not stubbed out with a fake step here.
