name: Deploy community manual to Pages

# Builds and publishes the standalone Community App Catalogue: every app
# in apps-catalog.json, with its manual (manual-tab.json), latest version,
# and a direct .fpapp download built fresh against the current faderpunk
# firmware. Replaces the old faderpunk-forge-based build (see git history
# for why that one was paused and retired) — this one is deliberately
# self-contained (tools/build-manual.py, stdlib Python only, no shared
# component code with faderpunk's own Configurator) so it's never tied to
# that repo's release schedule. See Package H's plan (faderpunk repo) for
# the full reasoning.
#
# `push` re-enabled now that the replacement exists: a merge to main
# (maintainer-controlled, via the PR gate), not an anonymous request.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "apps-catalog.json"
      - "manual-tab.json"
      - "tools/manual-site/**"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deploys should never run concurrently against the same
# environment -- queue rather than cancel, so a fast second push doesn't
# leave the live site mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout faderpunk-community-apps
        uses: actions/checkout@v4
        with:
          path: faderpunk-community-apps

      # Every .fpapp is ABI-pinned to the firmware it's built against —
      # this is an unavoidable, pre-existing coupling (same reason
      # `Makefile`'s FADERPUNK_DIR exists), not a new one. Building against
      # main rather than a pinned release tag for now — revisit if that
      # turns out to churn downloads too often.
      - name: Checkout faderpunk (build against current main)
        uses: actions/checkout@v4
        with:
          repository: ATOVproject/faderpunk
          path: faderpunk

      # nightly first, stable second so stable ends up the default
      # toolchain (fpapp's own `cargo run -p fpapp` needs that; only its
      # internal native-crate build step explicitly selects `+nightly`
      # itself, matching pr-scope.yml's manual-check job's reasoning for
      # the same requirement).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv8m.main-none-eabihf
          components: rust-src

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf

      # fpapp shells out to arm-none-eabi-readelf to extract ABI info from
      # each built native image — not on the runner by default.
      - name: Install ARM binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-none-eabi

      - name: Build every catalog app as a downloadable .fpapp
        working-directory: faderpunk-community-apps
        run: make fpapps FADERPUNK_DIR=../faderpunk

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No version pinned here on purpose — action-setup reads the
      # `packageManager` field from tools/manual-site/package.json, so the
      # lockfile and the pnpm that reads it can't drift apart.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: faderpunk-community-apps/tools/manual-site/package.json

      - name: Install the site build's dependencies
        working-directory: faderpunk-community-apps/tools/manual-site
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # base_path comes from configure-pages (the real serving path for a
      # project site, e.g. /faderpunk-community-apps/) rather than being
      # hardcoded, so this keeps working unmodified if the repo is ever
      # renamed or a custom domain changes the base.
      - name: Build the catalogue site
        working-directory: faderpunk-community-apps/tools/manual-site
        env:
          FADERPUNK_DIR: ${{ github.workspace }}/faderpunk
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: ./build.sh "${{ github.workspace }}/site" "${{ github.workspace }}/faderpunk-community-apps/build/fpapps"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
