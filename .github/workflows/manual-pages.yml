name: Deploy community manual to Pages

# PAUSED (2026-09-11): auto-deploy on push is disabled. faderpunk-forge's
# build-manual shells out to the same inject_community_manual logic that
# pr-scope.yml's manual-check used to run -- it string-matches literal
# markers in faderpunk's ManualTab.tsx, and ATOVproject/faderpunk#666
# rewrote that file (renamed the built-in apps array, changed the render
# call). Confirmed broken: this workflow failed twice against real merges
# to main today, "ManualTab.tsx: could not find the apps array
# declaration" -- same error manual-check hit before it was replaced
# (see faderpunk-community-apps#55). GitHub Pages keeps serving the last
# successful build on a failed run, so the public manual isn't down, just
# stale and falling further behind with every merge, silently.
#
# faderpunk-forge's manual tooling is being retired here rather than
# patched -- it exists to splice into a *whole rebuilt copy* of the
# official Configurator manual, which was the plan before FPApps made
# that unnecessary. The replacement is a lightweight, community-only
# manual build that doesn't depend on another repo's internal file
# structure at all (tracked in the FPApp plan, "Package H"). Re-enable the
# `push` trigger below once that replacement lands; until then this job
# still runs on demand (`workflow_dispatch`) if forge's markers happen to
# get fixed in the meantime, but nothing auto-publishes.
#
# Every merge to main means the community catalog (or its manual-tab.json
# entries) may have changed -- rebuild the real configurator's Manual tab
# with every currently merged community app spliced in, and publish it as
# a standalone GitHub Pages site. Same trigger posture as
# community-edition.yml: a merge to main (maintainer-controlled, via the
# PR gate), not an anonymous request. Read-only checkout of this repo's
# own tree; faderpunk and faderpunk-forge are both public, no token
# needed for either.

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deploys should never run concurrently against the same
# environment -- queue rather than cancel, so a fast second push doesn't
# leave the live site mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout faderpunk-community-apps
        uses: actions/checkout@v4
        with:
          path: faderpunk-community-apps

      - name: Checkout faderpunk-forge (public, no token needed)
        uses: actions/checkout@v4
        with:
          repository: ATOVproject/faderpunk-forge
          path: faderpunk-forge

      # Nightly, not stable: build-manual shells out to ./gen-bindings.sh
      # internally, which requires nightly -- same reason manual-check
      # (pr-scope.yml) uses nightly for this exact CLI.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Build the faderpunk-forge CLI
        working-directory: faderpunk-forge
        run: cargo build --release -p faderpunk-forge

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # base_path comes from configure-pages (the real serving path for a
      # project site, e.g. /faderpunk-community-apps/) rather than being
      # hardcoded here, so this keeps working unmodified if the repo is
      # ever renamed or a custom domain changes the base.
      - name: Build the manual (every currently merged community app)
        id: build
        run: |
          dist=$(./faderpunk-forge/target/release/faderpunk-forge build-manual \
            --community-path faderpunk-community-apps \
            --base-path "${{ steps.pages.outputs.base_path }}/" | tail -n1)
          echo "dist=$dist" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.dist }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
